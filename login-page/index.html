<!doctype html>
<html lang="en">
  <head>
    <link
      rel="icon"
      href="../images/Gemini_Generated_Image_6ds2w16ds2w16ds2.jpg"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Log into Relay</title>
  </head>

  <body>
    <div class="container" id="container">
      <div class="form-container sign-up">
        <form id="registerForm">
          <h1>Create Account</h1>

          <div class="social-icons">
            <a href="https://www.google.com/" target="_blank" class="icon">
              <i class="fa-brands fa-google"></i>
            </a>

            <a href="https://www.facebook.com/" class="icon" target="_blank">
              <i class="fa-brands fa-facebook-f"></i>
            </a>

            <a href="https://github.com/" class="icon" target="_blank">
              <i class="fa-brands fa-github"></i>
            </a>

            <a href="https://www.linkedin.com/" class="icon" target="_blank">
              <i class="fa-brands fa-linkedin-in"></i>
            </a>
          </div>

          <span>or use your email for registration</span>

          <input type="text" id="name" placeholder="Name" />
          <input type="email" id="registerEmail" placeholder="Email" />
          <input type="password" id="registerPassword" placeholder="Password" />

          <button type="submit">Sign Up</button>
        </form>
      </div>

      <div class="form-container sign-in">
        <form id="loginForm">
          <h2>Sign In to Enter</h2>
          <h1>Relay</h1>

          <div class="social-icons" target="_blank">
            <a href="https://www.google.com/" target="_blank" class="icon">
              <i class="fa-brands fa-google"></i>
            </a>

            <a href="https://www.facebook.com/" class="icon" target="_blank">
              <i class="fa-brands fa-facebook-f"></i>
            </a>

            <a href="https://github.com/" class="icon" target="_blank">
              <i class="fa-brands fa-github"></i>
            </a>

            <a href="https://www.linkedin.com/" class="icon" target="_blank">
              <i class="fa-brands fa-linkedin-in"></i>
            </a>
          </div>

          <span>or use your email password</span>

          <input type="email" id="loginEmail" placeholder="Email" />
          <input type="password" id="loginPassword" placeholder="Password" />

          <a href="#" title="Recover Your Password!">Forgot Your Password? </a>

          <button>Sign In</button>
        </form>
      </div>

      <div class="toggle-container">
        <div class="toggle">
          <div class="toggle-panel toggle-left">
            <h1>Welcome Back!</h1>

            <p>Enter your personal details to use all of Relay's premium features</p>

            <button class="hidden" id="login">Sign In for Relay</button>
          </div>
          <div class="toggle-panel toggle-right">
            <h1>Hello, friend!</h1>

            <p>
              Register with your personal details to use all of Relay's
              features
            </p>

            <button class="hidden" id="register">Sign Up for Relay</button>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
